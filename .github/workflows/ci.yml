name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: seanmiddleditch/gha-setup-ninja@v5
        if: runner.os == 'Windows'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset core-only
      - name: Build
        run: cmake --build --preset core-only
      - name: Test
        run: ctest --preset core-only

  app:
    name: Qt application (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja and system libraries
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 xvfb
      # Ubuntu 24.04 ships Qt 6.4; the app needs >= 6.5
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: qtmultimedia
          cache: true
      - name: Configure
        run: cmake --preset release -DBOAT_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build --preset release
      - name: Base chart for the simulator area (cached; rebuilt when the tool changes)
        uses: actions/cache@v4
        with:
          path: charts/base.mbtiles
          key: basemap-attersee-${{ hashFiles('tools/make_basemap.py') }}
      - name: Render base chart from OpenStreetMap if not cached
        run: |
          test -f charts/base.mbtiles || { pip install pillow && python3 tools/make_basemap.py --bbox 13.50,47.84,13.62,47.95 --zooms 11-15 --out charts/base.mbtiles; } || { rm -f charts/base.mbtiles; echo "::warning::base chart not rendered (Overpass unavailable) - screenshots without base map"; }
      - name: Chart tool tests
        run: pip install numpy pillow && python3 tests/python/test_tools.py
      - name: SYNTHETIC depth overlay for the screenshots (labelled as such, never shipped)
        run: |
          if [ -f charts/base.mbtiles ]; then
            pip install numpy pillow
            python3 .github/scripts/synthetic_depth.py charts/base.mbtiles 13.50,47.84,13.62,47.95 synthetic.asc
            python3 tools/make_depth.py --grid synthetic.asc --zooms 11-15 --name "Tiefen SYNTHETISCH" --attribution "SYNTHETISCHE Tiefen – nicht zur Navigation" --out charts/depth.mbtiles
          fi
      - name: Seamark overlay for the simulator area (small, cached)
        uses: actions/cache@v4
        with:
          path: charts/seamarks.mbtiles
          key: seamarks-attersee-v1
      - name: Download seamarks if not cached
        run: |
          test -f charts/seamarks.mbtiles || python3 tools/fetch_tiles.py --url "https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png" --bbox 13.50,47.84,13.59,47.90 --zooms 14-14 --out charts/seamarks.mbtiles --name "OpenSeaMap seamarks" --attribution "OpenSeaMap, CC BY-SA" --overlay --delay 0.5 || true
      - name: Smoke test + screenshots (simulator, no QML errors)
        run: |
          app=./build/release/src/app/openboat
          for mode in day night settings track courseup; do
            rm -f config/settings.json
            [ "$mode" = courseup ] && echo '{"orientation": "course", "safety_depth_m": 10}' > config/settings.json
            flag=""; [ "$mode" = night ] && flag="--night"; [ "$mode" = settings ] && flag="--page settings"
            [ "$mode" = track ] && flag="--zoom 18"
            set +e
            QT_DEBUG_PLUGINS=0 QT_QUICK_BACKEND=software QT_QPA_PLATFORM=xcb timeout -k 5 60 xvfb-run -a -s "-screen 0 1280x800x24" $app --config config/boat.example.json --demo $flag --screenshot screenshot-$mode.png --screenshot-delay 9000 > app-$mode.log 2>&1
            rc=$?
            set -e
            cat app-$mode.log
            echo "exit code: $rc"
            test $rc -eq 0
            ! grep -E "TypeError|ReferenceError|is not defined|Cannot assign|Unable to assign" app-$mode.log
          done
      - name: Track was recorded
        run: |
          ls -l config/tracks
          n=$(cat config/tracks/*.csv | grep -cv '^#')
          echo "$n track points"
          test "$n" -ge 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshot-*.png
